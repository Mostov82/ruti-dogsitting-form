<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תודה! הטופס נשלח 🐾</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Heebo', Arial, sans-serif;
      background: linear-gradient(135deg, #e07a5f 0%, #c75f45 100%);
      color: #2d2a26; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 18px; max-width: 480px; width: 100%;
      padding: 42px 30px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.18);
    }
    .paw { font-size: 3.4rem; }
    h1 { font-size: 1.6rem; margin: 10px 0 8px; color: #c75f45; }
    p { color: #6f6a63; font-size: 1.05rem; line-height: 1.6; margin: 0 0 22px; }
    a.btn {
      display: inline-block; background: #3d7a6f; color: #fff; text-decoration: none;
      padding: 12px 26px; border-radius: 12px; font-weight: 700; font-size: 1rem;
    }
    a.btn:hover { background: #336459; }
  </style>
</head>
<body>
  <div class="card">
    <div class="paw">🐾</div>
    <h1>תודה רבה! הטופס נשלח לרותי</h1>
    <p>קיבלנו את כל הפרטים על הכלב שלכם. רותי תחזור אליכם בהקדם.<br />מחכים לפגוש אתכם! 🐶</p>
    <a class="btn" href="index.html">חזרה לטופס</a>
  </div>
</body>
</html>
